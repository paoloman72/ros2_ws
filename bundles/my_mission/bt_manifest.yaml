# bt_manifest.yaml — keep in sync with your nodes and trees from day 1.
#
# This project directory IS a bundle directory (same layout the platform
# expects: manifest at root + behavior_trees/ + include/ + src/), so you can
# run Gate 1 (bt_bundle_builder --validate-only, guide §7.2) on it directly.
#
# Registration rule: every node is registered exactly once (README,
# "Node registration: one node, one place").
#   - Flow B (project nodes, e.g. GreetNode): declared below, self-contained.
#   - Flow A (devkit extra nodes, e.g. ExampleNode): registered by bt_devkit;
#     they must be vendored into the bundle for the platform — the phase-2
#     converter does this; until then keep such entries commented out.

version: 1

tree:
  main: behavior_trees/main.xml

plugin:
  name: my_mission_nodes

dependencies:
  - rclcpp
  - behaviortree_cpp
  - rclcpp_action
  - nav2_msgs
  - geometry_msgs
  - sensor_msgs
  - tf2_ros
  - tf2_geometry_msgs

nodes:
  - id: GreetNode
    class: my_mission::GreetNode
    header: greet_node.hpp

  # Vendored navigation nodes (Flow B; class names as in the
  # reference bundle, headers flat under include/).
  - id: CreatePose
    class: mobile_robot_bt::CreatePose
    header: create_pose.hpp

  - id: NavigateToPose
    class: mobile_robot_bt::NavigateToPose
    header: navigate_to_pose.hpp

  - id: WaitForRobotReady
    class: mobile_robot_bt::WaitForRobotReady
    header: wait_for_robot_ready.hpp

  # Flow A example (lives in bt_devkit, not in this project):
  # - id: ExampleNode
  #   class: bt_devkit::ExampleNode
  #   header: example_node.hpp

monitoring:
  actions:
    - navigate_to_pose  # the mission navigates
